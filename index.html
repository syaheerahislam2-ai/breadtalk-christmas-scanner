<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BreadTalk Christmas QR Scanner</title>
  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #064e3b;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: white;
      color: #14532d;
      max-width: 450px;
      margin: 20px auto;
      padding: 22px;
      border-radius: 18px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 9px 0;
      font-size: 16px;
      border-radius: 9px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: 0;
      background: #dc2626;
      color: white;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #reader video { width: 100%; border-radius: 12px; }
    .message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>🎄 BreadTalk Christmas Party 2026</h1>
  <div class="card">
    <h2>🎅 Booth Staff Scanner</h2>

    <label>Staff ID</label>
    <input id="staffID" placeholder="e.g. STAFF01">

    <label>Access Code</label>
    <input id="accessCode" type="password" placeholder="Your private access code">

    <button id="loginButton" onclick="login()">STAFF LOGIN</button>

    <div id="loginMessage" class="message"></div>

    <div id="scannerArea" hidden>
      <h3 id="boothName"></h3>
      <p>Scan the group's QR code after they complete your game.</p>
      <div id="reader"></div>
      <button id="scanButton" onclick="startScanner()">📷 START SCANNER</button>
      <div id="scanMessage" class="message"></div>
      <button onclick="logout()">LOG OUT</button>
    </div>
  </div>

<script>
  // Replace this with your Google Apps Script Web App URL.
  const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

  let currentStaff = null;
  let reader = null;
  let scannerControls = null;
  let busy = false;

  
async function startScanner() {
  const message = document.getElementById("scanMessage");
  const button = document.getElementById("scanButton");
  const readerArea = document.getElementById("reader");

  if (!currentStaff || scannerControls) return;

  try {
    message.textContent = "Opening camera. Please allow camera access.";

    if (!window.ZXingBrowser) {
      throw new Error("Scanner library did not load.");
    }

    readerArea.innerHTML = "";

    const video = document.createElement("video");
    video.style.width = "100%";
    video.style.borderRadius = "12px";
    video.setAttribute("autoplay", "true");
    video.setAttribute("muted", "true");
    video.setAttribute("playsinline", "true");
    readerArea.appendChild(video);

    reader = new ZXingBrowser.BrowserQRCodeReader();

    scannerControls = await reader.decodeFromVideoDevice(
      undefined,
      video,
      (result, error) => {
        if (result && !busy) {
          awardStamp(result.getText());
        }
      }
    );

    button.disabled = true;
    message.textContent = "Camera ready! Point it at the group QR code.";

  } catch (error) {
    scannerControls = null;
    message.textContent = "Camera error: " + error.message;
  }
}


    if (!staffID || !accessCode) {
      message.textContent = "Please enter your Staff ID and access code.";
      return;
    }

    button.disabled = true;
    message.textContent = "Checking staff details...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "validateStaff",
          staffID: staffID,
          accessCode: accessCode
        })
      });

      const result = await response.json();

      if (!result.success) throw new Error(result.message || "Login failed.");

      currentStaff = { staffID, accessCode };
      document.getElementById("boothName").textContent = result.boothName;
      document.getElementById("scannerArea").hidden = false;
      message.textContent = "Welcome, " + result.staffName + "!";
      document.getElementById("staffID").disabled = true;
      document.getElementById("accessCode").disabled = true;
      button.hidden = true;
    } catch (error) {
      message.textContent = "Login error: " + error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function startScanner() {
    const message = document.getElementById("scanMessage");
    const button = document.getElementById("scanButton");

    if (!currentStaff || scannerControls) return;

    if (!window.ZXingBrowser) {
      message.textContent = "Scanner library did not load. Please refresh.";
      return;
    }

    try {
      message.textContent = "Opening camera. Please allow camera access.";

      reader = new ZXingBrowser.BrowserQRCodeReader();

      scannerControls = await reader.decodeFromVideoDevice(
        undefined,
        document.getElementById("reader"),
        (result) => {
          if (result && !busy) awardStamp(result.getText());
        }
      );

      button.disabled = true;
      message.textContent = "Camera ready. Point it at the group QR code.";
    } catch (error) {
      message.textContent = "Camera error: " + error.message;
    }
  }

  async function stopScanner() {
    if (scannerControls) {
      scannerControls.stop();
      scannerControls = null;
    }
    document.getElementById("scanButton").disabled = false;
  }

  async function awardStamp(token) {
    if (busy) return;
    busy = true;
    await stopScanner();

    const message = document.getElementById("scanMessage");
    message.textContent = "Checking QR code and awarding stamp...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "awardStamp",
          token: token,
          staffID: currentStaff.staffID,
          accessCode: currentStaff.accessCode
        })
      });

      const result = await response.json();
      if (!result.success) throw new Error(result.message || "Stamp could not be awarded.");

      message.innerHTML =
        "<h2>🎉 STAMP AWARDED!</h2>" +
        "<p>Group: " + safe(result.groupName) + "</p>" +
        "<p>Booth: " + safe(result.boothName) + "</p>" +
        "<h2>" + result.totalStamps + " / 6 STAMPS</h2>" +
        (result.eligible
          ? "<h3>🎄 CONGRATULATIONS! ALL OF YOU ARE ELIGIBLE FOR THE CHRISTMAS LUCKY DRAW!</h3>"
          : "<p>Well done! Continue to the next booth.</p>");

      document.getElementById("scanButton").textContent = "SCAN NEXT GROUP";
    } catch (error) {
      message.textContent = error.message;
      document.getElementById("scanButton").textContent = "TRY AGAIN";
    } finally {
      busy = false;
      document.getElementById("scanButton").disabled = false;
    }
  }

  function safe(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[c]);
  }

  async function logout() {
    await stopScanner();
    currentStaff = null;
    busy = false;
    document.getElementById("scannerArea").hidden = true;
    document.getElementById("staffID").disabled = false;
    document.getElementById("accessCode").disabled = false;
    document.getElementById("staffID").value = "";
    document.getElementById("accessCode").value = "";
    document.getElementById("loginButton").hidden = false;
    document.getElementById("loginMessage").textContent = "";
    document.getElementById("scanMessage").textContent = "";
  }
</script>
</body>
</html>
