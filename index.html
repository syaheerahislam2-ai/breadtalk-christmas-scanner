
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BreadTalk Christmas Party 2026</title>

  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f3ed;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #00000015;
    }

    h1 {
      text-align: center;
      color: #a32626;
      font-size: 25px;
    }

    h2 {
      text-align: center;
      font-size: 19px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #a32626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #555;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #reader video {
      width: 100%;
      border-radius: 10px;
    }

    .message {
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      background: #f1f1f1;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    .booth {
      text-align: center;
      color: #a32626;
      font-weight: bold;
      font-size: 19px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎄 BreadTalk Christmas Party 2026</h1>
  <h2>Digital Stamp Collection</h2>

  <section id="loginArea">
    <h2>Staff Login</h2>

    <input
      id="staffID"
      type="text"
      placeholder="Enter Staff ID"
      autocomplete="username"
    >

    <input
      id="accessCode"
      type="password"
      placeholder="Enter Access Code"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      LOGIN
    </button>

    <div id="loginMessage" class="message" aria-live="polite">
      Please enter your staff details.
    </div>
  </section>

  <section id="scannerArea" class="hidden">

    <h2>Welcome, <span id="staffName"></span></h2>

    <div class="booth" id="boothName"></div>

    <p style="text-align:center">
      Scan the group's QR code to award their booth stamp.
    </p>

    <video id="reader" autoplay muted playsinline></video>

    <div id="scanMessage" class="message" aria-live="polite">
      Ready to scan.
    </div>

    <button id="scanButton" onclick="startScanner()">
      START SCANNER
    </button>

    <button class="secondary" onclick="stopScanner()">
      STOP SCANNER
    </button>

    <button class="secondary" onclick="logout()">
      LOG OUT
    </button>

  </section>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkJAAU_02v5ckoxtWQsk0ko27pcPXPKvYkwOLfpsH7l-onj-Md-Jm9DHfX_ixh8eST/exec";

  let currentStaff = null;
  let reader = null;
  let scannerControls = null;
  let busy = false;

  async function login() {
    const staffID = document.getElementById("staffID").value.trim();
    const accessCode = document.getElementById("accessCode").value.trim();
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    if (!staffID || !accessCode) {
      message.textContent = "Please enter your Staff ID and access code.";
      return;
    }

    button.disabled = true;
    message.textContent = "Checking staff details...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "validateStaff",
          staffID: staffID,
          accessCode: accessCode
        })
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || "Login failed.");
      }

      currentStaff = {
        staffID: staffID,
        accessCode: accessCode
      };

      document.getElementById("staffName").textContent = result.staffName;
      document.getElementById("boothName").textContent = result.boothName;

      document.getElementById("loginArea").classList.add("hidden");
      document.getElementById("scannerArea").classList.remove("hidden");

      document.getElementById("scanMessage").textContent =
        "Login successful. You can now scan a group QR code.";

    } catch (error) {
      message.textContent = "Login error: " + error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function startScanner() {
    if (!currentStaff) {
      alert("Please log in first.");
      return;
    }

    if (scannerControls) return;

    const message = document.getElementById("scanMessage");
    const button = document.getElementById("scanButton");

    if (!window.ZXingBrowser) {
      message.textContent = "QR scanner library could not load. Refresh the page.";
      return;
    }

    try {
      reader = new ZXingBrowser.BrowserQRCodeReader();

      button.disabled = true;
      message.textContent = "Starting camera...";

      scannerControls = await reader.decodeFromVideoDevice(
        undefined,
        "reader",
        async (result, error) => {
          if (result && !busy) {
            busy = true;
            const token = result.getText();

            await awardStamp(token);
          }
        }
      );

      message.textContent = "Camera started. Point it at a group QR code.";

    } catch (error) {
      scannerControls = null;
      message.textContent = "Camera error: " + error.message;
    } finally {
      button.disabled = false;
    }
  }

  function stopScanner() {
    if (scannerControls) {
      scannerControls.stop();
      scannerControls = null;
    }

    document.getElementById("scanMessage").textContent =
      "Scanner stopped.";

    document.getElementById("scanButton").disabled = false;
  }

  async function awardStamp(token) {
    const message = document.getElementById("scanMessage");

    stopScanner();
    message.textContent = "Checking QR code and awarding stamp...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: new URLSearchParams({
          action: "awardStamp",
          token: token,
          staffID: currentStaff.staffID,
          accessCode: currentStaff.accessCode
        })
      });

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || "Stamp could not be awarded.");
      }

      if (result.eligible) {
        message.textContent =
          "🎉 CONGRATULATIONS! " + result.groupName +
          " has collected all 6 stamps and is eligible for the lucky draw!";
      } else {
        message.textContent =
          "✅ Stamp awarded to " + result.groupName +
          " at " + result.boothName +
          "! Total stamps: " + result.totalStamps + " / 6";
      }

    } catch (error) {
      message.textContent = "Error: " + error.message;
    } finally {
      busy = false;
      document.getElementById("scanButton").disabled = false;
    }
  }

  function logout() {
    stopScanner();

    currentStaff = null;

    document.getElementById("staffID").value = "";
    document.getElementById("accessCode").value = "";

    document.getElementById("loginArea").classList.remove("hidden");
    document.getElementById("scannerArea").classList.add("hidden");

    document.getElementById("loginMessage").textContent =
      "Please enter your staff details.";

    busy = false;
  }
</script>

</body>
</html>
